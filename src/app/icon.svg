<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <!-- Crisp Bright Lunar Sphere Gradient (Optimized for small favicon sizes) -->
    <radialGradient id="favMoonSphere" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="35%" stop-color="#e2e8f0" />
      <stop offset="65%" stop-color="#94a3b8" />
      <stop offset="85%" stop-color="#475569" />
      <stop offset="100%" stop-color="#334155" />
    </radialGradient>

    <!-- Deep Crater Gradient -->
    <radialGradient id="favCrater" cx="40%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.9" />
      <stop offset="75%" stop-color="#475569" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#cbd5e1" stop-opacity="0.9" />
    </radialGradient>

    <!-- Luminous Orbit Gradient -->
    <linearGradient id="favOrbit" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00e5ff" stop-opacity="0" />
      <stop offset="35%" stop-color="#00e5ff" stop-opacity="1" />
      <stop offset="75%" stop-color="#38bdf8" stop-opacity="1" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="1" />
    </linearGradient>

    <filter id="favGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Outer Orbit Reference Ring (Faint) -->
  <circle cx="60" cy="60" r="54" fill="none" stroke="#0284c7" stroke-width="1.2" stroke-dasharray="3 4" opacity="0.6" />

  <!-- The Bright Moon Sphere (Centered, large) -->
  <circle cx="60" cy="60" r="40" fill="url(#favMoonSphere)" stroke="#64748b" stroke-width="1.2" />

  <!-- Lunar Maria (Dark Basaltic Plains) -->
  <path d="M 40 34 Q 50 28 60 34 Q 66 42 60 52 Q 50 56 42 50 Z" fill="#334155" opacity="0.45" />
  <path d="M 64 42 Q 74 38 80 48 Q 80 58 70 64 Q 60 58 64 42 Z" fill="#334155" opacity="0.4" />
  <path d="M 36 52 Q 46 54 48 66 Q 42 74 34 70 Q 28 62 36 52 Z" fill="#334155" opacity="0.38" />

  <!-- Craters -->
  <circle cx="60" cy="92" r="5" fill="url(#favCrater)" stroke="#94a3b8" stroke-width="1" />
  <circle cx="60" cy="92" r="2.2" fill="#0f172a" />
  <circle cx="46" cy="66" r="4" fill="url(#favCrater)" stroke="#cbd5e1" stroke-width="0.8" />
  <circle cx="72" cy="50" r="3.5" fill="url(#favCrater)" stroke="#94a3b8" stroke-width="0.8" />
  <circle cx="38" cy="40" r="2.5" fill="#334155" stroke="#94a3b8" stroke-width="0.6" />
  <circle cx="74" cy="72" r="3" fill="#334155" stroke="#94a3b8" stroke-width="0.6" />

  <!-- Artemis Dynamic Orbital Trajectory (Bold and Glowing) -->
  <path
    d="M 12 80 C 14 28, 70 10, 102 32 C 118 44, 116 78, 90 98 C 76 106, 64 98, 60 92"
    fill="none"
    stroke="url(#favOrbit)"
    stroke-width="4.5"
    stroke-linecap="round"
    filter="url(#favGlow)"
  />

  <!-- South Pole Target Reticle & Landing Beacon -->
  <circle cx="60" cy="92" r="9" fill="none" stroke="#38bdf8" stroke-width="1.2" stroke-dasharray="2 2" />
  <circle cx="60" cy="92" r="4.5" fill="#f59e0b" stroke="#ffffff" stroke-width="1.2" />
  <circle cx="60" cy="92" r="1.8" fill="#ffffff" />
</svg>
