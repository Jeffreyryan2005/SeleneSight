<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <!-- Outer Glow -->
    <radialGradient id="tabSpaceGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stopColor="#38bdf8" stopOpacity="0.6" />
      <stop offset="80%" stopColor="#0284c7" stopOpacity="0.15" />
      <stop offset="100%" stopColor="#0284c7" stopOpacity="0" />
    </radialGradient>

    <!-- Bright High-Contrast Lunar Shading (White/Silver to Slate) -->
    <radialGradient id="tabLunarSphere" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stopColor="#ffffff" />
      <stop offset="40%" stopColor="#f1f5f9" />
      <stop offset="70%" stopColor="#cbd5e1" />
      <stop offset="90%" stopColor="#64748b" />
      <stop offset="100%" stopColor="#334155" />
    </radialGradient>

    <!-- Vibrant Orbital Vector -->
    <linearGradient id="tabOrbitGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stopColor="#38bdf8" stopOpacity="0" />
      <stop offset="40%" stopColor="#0ea5e9" stopOpacity="0.9" />
      <stop offset="80%" stopColor="#38bdf8" stopOpacity="1" />
      <stop offset="100%" stopColor="#fbbf24" stopOpacity="1" />
    </linearGradient>

    <filter id="tabGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Transparent Background - NO dark box -->

  <!-- Outer Cyan Navigation Reticle Ring -->
  <circle cx="60" cy="60" r="56" fill="none" stroke="#38bdf8" strokeWidth="1.2" strokeDasharray="3 4" opacity="0.6" />

  <!-- Cardinal Compass Ticks -->
  <line x1="60" y1="2" x2="60" y2="7" stroke="#38bdf8" strokeWidth="2" />
  <line x1="60" y1="113" x2="60" y2="118" stroke="#38bdf8" strokeWidth="2" />
  <line x1="2" y1="60" x2="7" y2="60" stroke="#38bdf8" strokeWidth="2" />
  <line x1="113" y1="60" x2="118" y2="60" stroke="#38bdf8" strokeWidth="2" />

  <!-- Bright Moon Body (Highly Visible in Dark/Light Tabs) -->
  <circle cx="60" cy="60" r="42" fill="url(#tabLunarSphere)" stroke="#94a3b8" strokeWidth="1" filter="drop-shadow(0 0 6px rgba(56,189,248,0.4))" />

  <!-- Lunar Maria / Crater Shading -->
  <path d="M 44 38 Q 54 32 62 38 Q 68 45 62 54 Q 54 58 46 52 Z" fill="#64748b" opacity="0.45" />
  <path d="M 66 48 Q 76 44 80 54 Q 78 64 68 66 Z" fill="#64748b" opacity="0.4" />
  
  <!-- Craters -->
  <circle cx="60" cy="92" r="5" fill="#1e293b" stroke="#e2e8f0" strokeWidth="1" />
  <circle cx="46" cy="66" r="3.5" fill="#334155" stroke="#cbd5e1" strokeWidth="0.8" />
  <circle cx="72" cy="54" r="3.0" fill="#334155" stroke="#cbd5e1" strokeWidth="0.8" />

  <!-- Artemis Orbital Trajectory Swoop (Glowing Cyan to Gold) -->
  <path d="M 12 80 C 14 26, 70 10, 102 32 C 118 44, 114 78, 88 98 C 76 106, 64 100, 60 92"
        fill="none"
        stroke="url(#tabOrbitGrad)"
        strokeWidth="3.2"
        strokeLinecap="round"
        filter="url(#tabGlow)" />

  <!-- Glowing Golden Beacon at South Pole -->
  <circle cx="60" cy="92" r="6" fill="#f59e0b" fillOpacity="0.4" />
  <circle cx="60" cy="92" r="3.5" fill="#fbbf24" stroke="#ffffff" strokeWidth="1" />
  <circle cx="60" cy="92" r="1.5" fill="#ffffff" />
</svg>
