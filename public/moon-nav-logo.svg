<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <!-- Deep Space Radial Glow -->
    <radialGradient id="spaceGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stopColor="#0284c7" stopOpacity="0.4" />
      <stop offset="70%" stopColor="#0369a1" stopOpacity="0.1" />
      <stop offset="100%" stopColor="#000000" stopOpacity="0" />
    </radialGradient>

    <!-- Lunar Sphere Shading (3D South Pole Illumination) -->
    <radialGradient id="lunarSphere" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stopColor="#f8fafc" />
      <stop offset="35%" stopColor="#cbd5e1" />
      <stop offset="65%" stopColor="#64748b" />
      <stop offset="88%" stopColor="#1e293b" />
      <stop offset="100%" stopColor="#090d16" />
    </radialGradient>

    <!-- Crater Shadow Gradients -->
    <radialGradient id="craterDark" cx="40%" cy="40%" r="55%">
      <stop offset="0%" stopColor="#0f172a" stopOpacity="0.8" />
      <stop offset="75%" stopColor="#334155" stopOpacity="0.4" />
      <stop offset="100%" stopColor="#94a3b8" stopOpacity="0.9" />
    </radialGradient>

    <!-- Artemis Orbital Trajectory Glow -->
    <linearGradient id="orbitGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stopColor="#38bdf8" stopOpacity="0" />
      <stop offset="40%" stopColor="#0ea5e9" stopOpacity="0.8" />
      <stop offset="75%" stopColor="#38bdf8" stopOpacity="1" />
      <stop offset="100%" stopColor="#f59e0b" stopOpacity="1" />
    </linearGradient>

    <!-- Beacon Glow -->
    <filter id="beaconGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background Glow -->
  <circle cx="60" cy="60" r="58" fill="url(#spaceGlow)" />

  <!-- Outer Celestial Navigation Reticle (Subtle Compass Ring) -->
  <circle cx="60" cy="60" r="54" fill="none" stroke="#0ea5e9" strokeWidth="0.8" strokeDasharray="3 4" opacity="0.45" />
  <circle cx="60" cy="60" r="48" fill="none" stroke="#38bdf8" strokeWidth="0.5" opacity="0.25" />

  <!-- Cardinal Compass Tick Marks -->
  <line x1="60" y1="3" x2="60" y2="8" stroke="#38bdf8" strokeWidth="1.5" opacity="0.8" />
  <line x1="60" y1="112" x2="60" y2="117" stroke="#38bdf8" strokeWidth="1.5" opacity="0.8" />
  <line x1="3" y1="60" x2="8" y2="60" stroke="#38bdf8" strokeWidth="1.5" opacity="0.8" />
  <line x1="112" y1="60" x2="117" y2="60" stroke="#38bdf8" strokeWidth="1.5" opacity="0.8" />

  <!-- The Moon Body -->
  <circle cx="60" cy="60" r="38" fill="url(#lunarSphere)" stroke="#475569" strokeWidth="0.5" />

  <!-- Mare / Basaltic Regolith Patterns (Maria Imbrium & Serenitatis touches) -->
  <path d="M 42 36 Q 50 32 58 37 Q 64 42 60 50 Q 52 54 44 48 Z" fill="#334155" opacity="0.35" />
  <path d="M 62 44 Q 72 40 76 49 Q 77 58 68 62 Q 60 56 62 44 Z" fill="#334155" opacity="0.3" />
  <path d="M 38 52 Q 46 54 48 64 Q 44 72 36 68 Q 32 60 38 52 Z" fill="#334155" opacity="0.28" />

  <!-- Detailed Impact Craters with Shaded Rims -->
  <!-- Crater 1: Shackleton (near South Pole bottom) -->
  <circle cx="60" cy="90" r="4.5" fill="url(#craterDark)" stroke="#94a3b8" strokeWidth="0.6" />
  <circle cx="60" cy="90" r="2" fill="#020617" />
  <!-- Crater 2: Copernicus/Tycho style ray crater -->
  <circle cx="48" cy="66" r="3.5" fill="url(#craterDark)" stroke="#cbd5e1" strokeWidth="0.6" />
  <!-- Crater 3: Mare crater -->
  <circle cx="70" cy="52" r="3.0" fill="url(#craterDark)" stroke="#94a3b8" strokeWidth="0.5" />
  <!-- Micro craters -->
  <circle cx="40" cy="42" r="1.8" fill="#1e293b" stroke="#64748b" strokeWidth="0.4" />
  <circle cx="72" cy="70" r="2.2" fill="#1e293b" stroke="#64748b" strokeWidth="0.4" />
  <circle cx="52" cy="80" r="2.0" fill="#0f172a" stroke="#475569" strokeWidth="0.4" />

  <!-- South Pole Navigation Crosshair (Targeting Shackleton Rim) -->
  <g opacity="0.85">
    <circle cx="60" cy="90" r="7" fill="none" stroke="#38bdf8" strokeWidth="1" strokeDasharray="2 2" />
    <line x1="60" y1="80" x2="60" y2="86" stroke="#38bdf8" strokeWidth="1" />
    <line x1="60" y1="94" x2="60" y2="100" stroke="#38bdf8" strokeWidth="1" />
    <line x1="50" y1="90" x2="56" y2="90" stroke="#38bdf8" strokeWidth="1" />
    <line x1="64" y1="90" x2="70" y2="90" stroke="#38bdf8" strokeWidth="1" />
    <circle cx="60" cy="90" r="1" fill="#f59e0b" />
  </g>

  <!-- Orbital Navigation Vector (Curving around from deep space to South Pole) -->
  <path d="M 14 78 C 16 30, 68 14, 98 34 C 114 46, 112 76, 88 94 C 76 102, 64 96, 60 90"
        fill="none"
        stroke="url(#orbitGrad)"
        strokeWidth="2.4"
        strokeLinecap="round"
        filter="url(#beaconGlow)" />

  <!-- Navigation Craft / Beacon Pulse at South Pole insertion -->
  <g transform="translate(60, 90)">
    <circle cx="0" cy="0" r="2.5" fill="#f59e0b" />
    <circle cx="0" cy="0" r="4.5" fill="none" stroke="#fef08a" strokeWidth="0.8" opacity="0.8" />
  </g>

  <!-- North Celestial Polar Indicator Star -->
  <g transform="translate(60, 6)">
    <polygon points="0,-3 1,-1 3,0 1,1 0,3 -1,1 -3,0 -1,-1" fill="#38bdf8" />
  </g>
</svg>
